- company:
    name: Broadpin
    url: "https://www.broadpin.com"
    location: Half Moon Bay, CA
    overview: Consulting and Technology Solutions for Project-Based Organizations
  positions:
  - designation: Systems Engineer
    start: December 2024
    responsibilities:
    - Serve as the sole IT & Systems Engineer for North America within a larger global team, managing regional infrastructure, end-user technology, and cloud operations with full ownership.
    - Optimized AWS cloud infrastructure by migrating always-on workloads to Reserved Instances and deploying Savings Plans, reducing monthly compute spend by ~$400/month (a ~16% reduction on a $2,500/mo baseline) while maintaining operational flexibility.
    - Led and executed the full migration of 70 users from Google Workspace to Microsoft 365, including email routing, DNS cutover, and SPF/DKIM/DMARC authentication with zero business communication downtime.
    - Engineered and executed a Microsoft 365 tenant-to-tenant migration to integrate with the new parent company—seamlessly transferring 70 users, 200+ Microsoft Teams channels, and 10 SharePoint sites without data loss.
    - Managed and modernized AWS cloud environments, provisioning, hardening, and troubleshooting Linux EC2 workloads to maintain high availability and performance.
    - Engineered and deployed Amazon CloudWatch alarms and proactive alerting pipelines to rapidly detect system degradation, monitor resource utilization, and automate incident response.
    - Led SSL/TLS certificate lifecycle management, tracking expirations, and executing seamless renewals across enterprise domains and web endpoints to guarantee continuous service continuity.
    - Planned and executed the migration of on-prem file shares to SharePoint Online—improving collaboration and data security.
    - Designed and deployed Azure DevOps pipelines and boards to streamline internal development projects.
    - Developed PowerShell and Python automation for account provisioning, inventory updates, and routine tasks.
    - Wrote snapshot cleanup scripts and implemented retention policies to reduce long-term storage costs.
    - Supported Microsoft 365, Azure AD, and Google Workspace (MFA, identity federation, and user lifecycle management).
    - Strengthened tenant security through MFA enforcement, conditional access policies, and risk-based sign-in monitoring.
    - Led critical incident response and recovery efforts, strengthening infrastructure resilience and implementing improved security controls to prevent future threats.
    - Transitioned legacy antivirus to ESET XDR with Cloudconsole management, improving endpoint visibility and threat response.
    - Streamlined onboarding and offboarding workflows, coordinating account access, devices, and licensing for distributed teams.
    - Collaborated with partners and vendors.
    - Maintained and improved IT documentation, SharePoint-based inventories, and internal knowledge systems.
    - Managed hardware/software procurement, device imaging, and shipping logistics for remote employees.
    - Hardened DNS and email configurations (DKIM, SPF, DMARC) to improve domain trust and deliverability.
    - Modernized hybrid infrastructure by decommissioning redundant servers and automating environment cleanup.
    - Earned Oracle Cloud Support Specialist certification and pursuing additional Microsoft and AWS certifications.

