# a summary about you
summary: "Bay Area–based systems administrator responsible for IT operations and cloud infrastructure across North America at Broadpin. I specialize in Microsoft 365, Entra ID and Zero Trust security, Intune, and AWS operations, and I lead M&A migrations, identity and endpoint hardening, and cloud reliability work across AWS and Microsoft environments.\n\nI combine deep production infrastructure experience with modern AI engineering workflows (Antigravity, Claude, VS Code)—rapidly architecting resilient PowerShell and Python automation, Microsoft Graph API integrations, and internal web applications that eliminate operational bottlenecks and scale enterprise capability.\n\nBeyond enterprise systems, I am a CMSP-certified Motorcycle Safety Instructor and teach the California Motorcyclist Safety Program curriculum for Pacific Motorcycle Training—a role that demands calm communication, systematic risk mitigation, and disciplined coaching in high-stakes environments."

