# a summary about you
summary: "Senior Systems & Cloud Infrastructure Engineer based in the San Francisco Bay Area specializing in Microsoft 365 Architecture, Entra ID / Zero Trust Security, Intune Endpoint Engineering, Microsoft Purview Compliance, AWS Cloud Operations, and AI-Augmented Automation. \n\nServing as the primary infrastructure engineer managing IT operations and cloud environments across North America at Broadpin, I architect zero-downtime M&A migrations, harden hybrid identity and endpoint estates, and drive proactive cloud reliability across AWS and Microsoft ecosystems. \n\nI combine deep production infrastructure experience with modern AI engineering workflows (Antigravity, Claude, VS Code)—rapidly architecting resilient PowerShell and Python automation, Microsoft Graph API integrations, and internal web applications that eliminate operational bottlenecks and scale enterprise capability. \n\nBeyond enterprise systems, I am a Certified Motorcycle Safety Instructor with Pacific Motorcycle Training—a role that demands calm communication, systematic risk mitigation, and disciplined coaching in high-stakes environments."

